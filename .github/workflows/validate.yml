name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    name: Python and compatibility tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run metadata tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
      - name: Run fixed regression fixtures
        run: python scripts/evaluate_fixtures.py --fixtures tests/fixtures/regression --revision ${{ github.sha }}
      - name: Run document-driven test task
        run: python scripts/run_test_task.py --task docs/GoalAnchor-自动测试任务.md
      - name: Upload document-driven test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goalanchor-test-report-${{ github.sha }}
          path: test-results/goalanchor-baseline.json
          if-no-files-found: warn

  javascript:
    name: JavaScript syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check OpenAI Docs scripts
        run: |
          node --check skills/.system/openai-docs/scripts/fetch-codex-manual.mjs
          node --check skills/.system/openai-docs/scripts/resolve-latest-model-info.cjs
