name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    name: Python tests and fixtures (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, Windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run metadata tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
      - name: Run fixed regression fixtures
        run: python scripts/evaluate_fixtures.py --fixtures tests/fixtures/regression --revision ${{ github.sha }}
      - name: Run document-driven test task
        run: python scripts/run_test_task.py --task docs/GoalAnchor-自动测试任务.md
      - name: Upload document-driven test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goalanchor-test-report-${{ github.sha }}
          path: test-results/goalanchor-baseline.json
          if-no-files-found: warn

  quality:
    name: Lint, types, and bundle sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lint/type tools
        run: python -m pip install ruff mypy
      - name: Ruff
        run: python -m ruff check goalanchor tests scripts
      # Mypy runs on every change so the type baseline stays visible; it is
      # not yet blocking — the codebase predates typing and has a known set of
      # precision findings (dynamic attribute / boundary object types). Tighten
      # to a required gate once those converge.
      - name: Mypy (non-blocking baseline)
        continue-on-error: true
        run: python -m mypy goalanchor
      - name: Bundled skill is in sync
        run: python scripts/sync_skill_bundle.py --check

  javascript:
    name: JavaScript syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Check OpenAI Docs scripts
        run: |
          node --check skills/.system/openai-docs/scripts/fetch-codex-manual.mjs
          node --check skills/.system/openai-docs/scripts/resolve-latest-model-info.cjs
      - name: Set up Python for portable desktop bridge tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PI-Desktop behavioral and portable bridge checks
        run: node --test tests/js/test_pi_desktop.cjs
